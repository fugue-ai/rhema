[package]
name = "rhema-workspace"
version = "0.1.0"
authors = ["Cory Parent <cory.parent@gmail.com>"]
edition = "2021"
documentation = "https://fugue-ai.github.io/rhema"
readme = "README.md"
homepage = "https://github.com/fugue-ai/rhema"
repository = "https://github.com/fugue-ai/rhema"
license = "Apache-2.0"
keywords = ["agent", "ai", "cli", "context", "git", "protocol", "yaml"]
categories = ["command-line-utilities", "configuration", "development-tools"]

[workspace.package]
version = "0.1.0"
authors = ["Cory Parent <cory.parent@gmail.com>"]
edition = "2021"
description = "Rhema AI Agent Framework"
documentation = "https://docs.rs/rhema"
readme = "README.md"
homepage = "https://github.com/fugue-ai/rhema"
repository = "https://github.com/fugue-ai/rhema"
license = "Apache-2.0"
keywords = ["agent", "ai", "cli", "context", "git", "protocol", "yaml"]
categories = ["command-line-utilities", "configuration", "development-tools"]

[workspace.dependencies]
actix-web = "4.4"
anthropic = "0.0.8"
anyhow = "1.0"
assert_fs = "1.1"
async-trait = "0.1"
# MCP Daemon Dependencies
axum = { version = "0.7", features = ["ws"] }
base64 = "0.21"
bincode = "1.3"
cached = "0.44"
# Additional utilities
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
console = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
dashmap = "5.5"
# Additional CLI dependencies
dialoguer = "0.11"
dirs = "5.0"
env_logger = "0.10"
flate2 = "1.0"
futures = "0.3"
git2 = "0.18"
indicatif = "0.17"
insta = "1.34"
lazy_static = "1.4"
# Compression dependencies
lz4 = "1.24"
markdown = "0.3"
mockall = "0.12"
nix = { version = "0.27", features = ["process", "signal"] }
notify = "6.1"
num_cpus = "1.16"
# AI Service dependencies
openai = "1.0"
# Additional dependencies for syneidesis
parking_lot = "0.12"
predicates = "3.0"
prometheus = "0.13"
proptest = "1.3"
prost = "0.12"
prost-types = "0.12"
quickcheck = "1.0"
rand = "0.8"
rayon = "1.8"
# AI Service and Performance Optimization
redis = { version = "0.23", features = ["connection-manager", "tokio-comp"] }
regex = "1.10"
# Git integration enhancements
reqwest = { version = "0.11", features = ["json"] }
rstest = "0.18"
# Interactive mode dependencies
rustyline = "12.0"
semver = "1.0"
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
shellexpand = "3.1"
snapbox = "0.5"
syneidesis-config = { path = "crates/syneidesis/config" }
# Syneidesis Coordination Library
syneidesis-coordination = { path = "crates/syneidesis/coordination" }
syneidesis-grpc = { path = "crates/syneidesis/grpc" }
syntect = "5.1"
tar = "0.4"
# Test dependencies
tempfile = "3.8"
test-case = "3.3"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
# gRPC and networking dependencies
tokio-stream = "0.1"
tokio-tungstenite = "0.20"
tokio-util = "0.7"
toml = "0.8"
tonic = { version = "0.10", features = ["tls"] }
tower-http = { version = "0.5", features = ["compression-full", "cors", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
trycmd = "0.15"
uuid = { version = "1.6", features = ["serde", "v4"] }
validator = { version = "0.16", features = ["derive"] }
walkdir = "2.4"
zstd = "0.13"

[workspace.lints.rust]
dead_code = "allow"  # allow dead code until API is stable
unused_assignments = "allow"  # allow unused assignments until API is stable
unused_comparisons = "allow"  # allow unused comparisons for test coverage
unused_imports = "allow"  # allow unused imports until API is stable
unused_variables = "allow"  # allow unused variables until API is stable

[lib]
path = "crates/rhema-api/src/lib.rs"

[[bin]]
name = "test_daemon"
path = "tests/daemon/test_daemon.rs"

[[bin]]
name = "test_daemon_simple"
path = "tests/daemon/test_daemon_simple.rs"

[[bin]]
name = "rhema"
path = "runtime/rhema-cli/main.rs"

[[example]]
name = "core_unit_tests"
path = "examples/testing/core_unit_tests.rs"

[[example]]
name = "prompt_pattern_advanced_features_example"
path = "examples/advanced/prompt_pattern_advanced_features_example.rs"

[dependencies]
# External dependencies
anyhow = "1.0"
bincode = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
flate2 = "1.0"
hyper = "1"
lazy_static = "1.4"
log = "0.4"
regex = "1.10"
reqwest = { version = "0.11", features = ["json"] }
rhema-action = { path = "crates/rhema-action" }
rhema-api = { path = "crates/rhema-api" }
rhema-cli = { path = "runtime/rhema-agent" }
rhema-config = { path = "crates/rhema-config" }
rhema-coordination = { path = "crates/rhema-coordination" }
# Internal crates
rhema-core = { path = "crates/rhema-core" }
rhema-dependency = { path = "crates/rhema-dependency" }
rhema-git = { path = "crates/rhema-git" }
rhema-integrations = { path = "crates/rhema-integrations" }
rhema-knowledge = { path = "crates/rhema-knowledge" }
rhema-locomo = { path = "crates/rhema-locomo" }
rhema-mcp = { path = "crates/rhema-mcp" }
rhema-monitoring = { path = "crates/rhema-monitoring" }
rhema-query = { path = "crates/rhema-query" }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
# Syneidesis Coordination Library
syneidesis-coordination = { workspace = true }
tempfile = "3.8"
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.6", features = ["serde", "v4"] }

[dev-dependencies]
assert_fs = "1.1"
async-trait = "0.1"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.10"
futures = "0.3"
git2 = "0.18"
insta = "1.34"
mockall = "0.12"
predicates = "3.0"
proptest = "1.3"
quickcheck = "1.0"
rand = "0.8"
rstest = "0.18"
snapbox = "0.5"
tempfile = "3.8"
test-case = "3.3"
trycmd = "0.15"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1

