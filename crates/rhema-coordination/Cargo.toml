[package]
name = "rhema-coordination"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Coordination and AI service integration for Rhema"
keywords = ["coordination", "ai", "context", "injection", "service"]
categories = ["development-tools"]

[dependencies]
rhema-core = { path = "../rhema-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["full"] }
cached = { workspace = true }
sha2 = "0.10"
clap = { workspace = true }
dashmap = "5.5"

# gRPC dependencies
tonic = { version = "0.10", features = ["tls", "tls-roots", "prost"] }
prost = "0.12"
prost-types = "0.12"

# Security and performance
rustls = "0.21"
rustls-pemfile = "1.0"
webpki-roots = "0.25"
flate2 = "1.0"
brotli = "3.4"
zstd = "0.12"

# Authentication and authorization
jsonwebtoken = "9.2"
base64 = "0.21"

# Error handling and resilience
rand = "0.8"

# Syneidesis dependencies
syneidesis-coordination = { path = "../syneidesis/coordination" }
syneidesis-grpc = { path = "../syneidesis/grpc" }
syneidesis-core = { path = "../syneidesis/core" }
syneidesis-agent = { path = "../syneidesis/agent" }
syneidesis-config = { path = "../syneidesis/config" }

[build-dependencies]
tonic-build = "0.10"

[dev-dependencies]
tempfile = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true } 