[package]
name = "rhema-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Core data structures and fundamental operations for the Rhema Protocol"
keywords = ["core", "schema", "scope", "protocol"]
categories = ["development-tools"]



[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
git2 = { workspace = true }
dirs = { workspace = true }
lazy_static = { workspace = true }
regex = { workspace = true }
validator = { workspace = true }
clap = { workspace = true, features = ["derive"] }
toml = { workspace = true }
rustyline = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
notify = { workspace = true }
bincode = { workspace = true }
prometheus = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread"] }
async-trait = "0.1"
tracing = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
semver = { workspace = true }
num_cpus = { workspace = true }
md5 = "0.7"

[features]
default = ["coordination"]
coordination = ["syneidesis-grpc"]

[dependencies.syneidesis-grpc]
path = "../syneidesis/grpc"
optional = true

[dependencies.prost-types]
version = "0.12"
optional = true

[dependencies.syneidesis-config]
path = "../syneidesis/config"
optional = true

[dev-dependencies]
tempfile = { workspace = true }
assert_fs = { workspace = true }
predicates = { workspace = true }
tracing-subscriber = "0.3" 
